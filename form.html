.big{font-size:26px;font-weight:600;display:block;margin:4px 0}
.lab{font-size:14px;font-weight:500;margin:16px 0 8px}.lab small{font-weight:400;color:var(--mute)}.tiny{font-size:13px;color:var(--mute);margin:6px 0 0;min-height:1em}

    h='<h1>'+s.q+req(s)+'</h1><p class="hint">'+s.h+'</p><input type="text" inputmode="decimal" class="dec" id="num" value="'+esc(A[s.k])+'">';
  }else if(s.type==='file'){
    h='<h1>'+s.q+req(s)+'</h1><p class="hint">'+s.h+'</p><label class="file"><input type="file" id="fl" accept="'+(s.acc||'.xlsx,.xls,.pdf,image/*')+'" multiple>'+(A[s.k]?'✓ '+esc(A[s.k]):s.lab)+'</label>';
  }else{
    const rows=st.map((x,j)=>[x,j]).filter(([x])=>x.k&&(!x.when||x.when())).map(([x,j])=>'<div class="row"><span>'+x.q.replace(/ไหม$|อะไร$|เท่าไร$|ไหน$/,'').trim()+'</span><span>'+esc(label(x))+'<button type="button" class="edit" data-go="'+j+'">แก้</button></span></div>').join('');
    h='<h1>ตรวจข้อมูลก่อนส่ง</h1><p class="hint">กด "แก้" เพื่อกลับไปแก้ข้อนั้น'+(FORMS[F].quote?'':' · ส่งได้ครั้งเดียวต่อการชำระ 1 ครั้ง')+'</p><div class="sum">'+rows+'</div>'+(bigJob()?'<div class="warn">'+bigJob()+'</div>':'')+(FORMS[F].quote?'<div class="warn" style="background:var(--mint);color:var(--mintink)">'+quoteTxt()+'</div>':UNPAID?'<div class="warn" style="background:var(--mint);color:var(--mintink)">'+sumPrice()+'<br>ไม่มี VAT · กดส่งแล้วกลับไปที่ LINE สแกน QR ชำระ แล้วส่งสลิป · ทีมเริ่มงานทันทีที่ยืนยันยอด</div>':'')+'<div class="lab">มีโค้ดส่วนลดไหม <small>(ไม่บังคับ)</small></div><div style="display:flex;gap:8px"><input type="text" id="promo" placeholder="เช่น FJ100" style="text-transform:uppercase;flex:1" value="'+esc(A.promo||(CODEP?CODEP.code:''))+'" onchange="applyCode()"><button type="button" class="edit" style="padding:8px 14px" onclick="applyCode()">ใช้โค้ด</button></div><div id="promomsg" class="hint" style="margin-top:4px">'+(CODEP?'✓ ใช้โค้ด '+esc(CODEP.code)+' แล้ว'+(PROMO?' (ซ้อนกับ'+esc(PROMO.label)+')':''):'')+'</div>';
  }
  card.innerHTML=h;
  if(s.type==='size')bim();
}
function save(){
  const s=FORMS[F].steps[i],o=$('oth'),t=$('txt'),t2=$('txt2'),nm=$('num');
  if(o){if(s.multi)A[s.k+'_o']=o.value.trim();else A[s.k]=o.value.trim()||'อื่นๆ'}
  if(o&&o.tagName==='SELECT')err.textContent='';
  if(t)A[s.k]=t.value.trim();if(t2)A.focus=t2.value.trim();
  if(nm)A[s.k]=nm.value.trim();
  if(s.type==='size'){const z=A.size,g=id=>$(id).value.trim();if(g('flo'))z.fl=g('flo');z.w=g('zw');z.l=g('zl');z.area=g('za');z.land=g('zd');z.landwl=g('zdw')}
  if(s.type==='rooms')A.rooms.other=$('rot').value.trim();
  if(s.type==='sum'&&$('promo'))A.promo=$('promo').value.trim().toUpperCase();
  if(s.type==='fields')s.f.forEach(f=>{A[s.k][f[0]]=$('fd_'+f[0]).value.trim()});
}
function valid(){const s=FORMS[F].steps[i];if(!s.k||s.opt)return true;
  if(s.type==='size'){const z=A.size;if(!z.fl)return 'เลือกจำนวนชั้นก่อนนะครับ';if(!z.area&&!(z.w&&z.l))return 'กรอกพื้นที่ใช้สอย หรือ กว้าง × ยาว อย่างใดอย่างหนึ่ง';return true}
  if(s.type==='rooms')return A.rooms.bed+A.rooms.bath>0||'ใส่จำนวนห้องอย่างน้อย 1 ห้อง';
  if(s.type==='fields'){const m=s.f.find(f=>f[2]&&!(A[s.k]||{})[f[0]]);return m?'กรอก '+m[1]+' ก่อนนะครับ':true}
  if(s.multi){const n=(A[s.k]||[]).length+(A[s.k+'_o']?1:0);if(A[s.k+'_o']==='')return 'พิมพ์ระบุในช่อง อื่นๆ ก่อนนะครับ';return n>0||'เลือกอย่างน้อย 1 อย่าง'}
  if(A[s.k]==='อื่นๆ')return 'พิมพ์ระบุในช่อง อื่นๆ ก่อนนะครับ';
  return A[s.k]!=null&&A[s.k]!==''}
card.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-go]');if(!b)return;const s=FORMS[F].steps[i];
  if(b.dataset.fl){save();A.size.fl=b.dataset.fl;render();return}
  if(b.dataset.v!=null&&s.multi){save();if(b.dataset.v==='อื่นๆ'){if(A[s.k+'_o']!=null)delete A[s.k+'_o'];else A[s.k+'_o']=''}else{const a=A[s.k]||(A[s.k]=[]),j=a.indexOf(b.dataset.v);j<0?a.push(b.dataset.v):a.splice(j,1)}render();return}
  if(b.dataset.v!=null){A[s.k]=b.dataset.v;render();return}
  if(b.dataset.r){const r=A.rooms;r[b.dataset.r]=Math.max(0,Math.min(20,r[b.dataset.r]+ +b.dataset.d));$('r_'+b.dataset.r).textContent=r[b.dataset.r];return}
  if(b.dataset.go!=null){i=+b.dataset.go;render()}
});
card.addEventListener('input',e=>{err.textContent='';setTimeout(()=>{if(FORMS[F].steps[i].type==='size'){A.size.area=$('za').value.trim();if($('flo').value)A.size.fl=$('flo').value}if(FORMS[F].steps[i].type==='fields')save();showPrice()},0);
  const t=e.target;if(t.classList&&t.classList.contains('dec')){let v=t.value.replace(',','.').replace(/[^\d.]/g,'');const p=v.indexOf('.');if(p>=0)v=v.slice(0,p+1)+v.slice(p+1).replace(/\./g,'').slice(0,2);if(t.value!==v)t.value=v}
  if(t.classList&&t.classList.contains('int')){const v=t.value.replace(/\D/g,'').slice(0,2);if(t.value!==v)t.value=v}
  if(FORMS[F].steps[i].type==='size'){if(e.target.id==='flo'){A.size.fl=e.target.value.trim();card.querySelectorAll('[data-fl]').forEach(x=>x.classList.remove('on'))}
    const w=parseFloat($('zw').value),l=parseFloat($('zl').value),f=parseInt(A.size.fl)||0,za=$('za');
    bim();
    if(w&&l&&f&&(e.target.id!=='za')){const a=Math.round(w*l*f*100)/100;if(FORMS[F].steps[i].def){$('zcalc').textContent='จากกว้าง × ยาว × ชั้น ≈ '+a+' ตร.ม. · ถ้าตัวเลขจริงต่างจาก '+za.value+' แก้ช่องด้านบนได้';return}za.value=a;$('zcalc').textContent='คำนวณ '+w+' × '+l+' × '+f+' ชั้น = '+a+' ตร.ม. (แก้ได้ถ้าแต่ละชั้นไม่เท่ากัน)'}}
});
card.addEventListener('change',e=>{if(e.target.id==='fl'){const s=FORMS[F].steps[i];FILES[s.k]=[...e.target.files];A[s.k]=FILES[s.k].map(f=>f.name).join(', ');render()}});
$('next').addEventListener('click',()=>{
  save();const st=FORMS[F].steps;
  if(st[i].type==='sum'){send();return}
  const v=valid();if(v!==true){err.textContent=typeof v==='string'?(FORMS[F].steps[i].list&&A[FORMS[F].steps[i].k]==='อื่นๆ'?'เลือกจังหวัดจากรายการก่อนนะครับ':v):'เลือกหรือกรอกข้อนี้ก่อนนะครับ';return}
  i++;while(st[i].when&&!st[i].when())i++;render();
});
$('back').addEventListener('click',()=>{save();const st=FORMS[F].steps;if(i)i--;while(i&&st[i].when&&!st[i].when())i--;render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();$('next').click()}});
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r({name:f.name,type:f.type,b64:String(x.result).split(',')[1]});x.readAsDataURL(f)});
async function send(){
  const nb=$('next'),z=A.size||{},r=A.rooms||{},pl=A.plot||{},o={ref:REF,svc:F,k:K,files:{},name:A.name||'',focus:A.focus||'',promo:A.promo||'',lang:LANGS[A.lang]||'th'};
  nb.disabled=true;nb.textContent='กำลังส่ง…';
  for(const k in FILES){const key=k==='drw'||k==='draw'?'drawings':k;o.files[key]=[];for(const f of FILES[k]){if(f.size>40e6){err.textContent='ไฟล์ '+f.name+' เกิน 40MB · ส่งในแชต LINE แทน';continue}o.files[key].push(await rd(f))}}
  if(F==='1.1')Object.assign(o,{province:A.prov,floors:z.fl,area_m2:z.area,fw:z.w,fl:z.l,land_sqw:z.land,land_wl:z.landwl,bedrooms:r.bed,bathrooms:r.bath,rooms:'ห้องนอน '+r.bed+' · ห้องน้ำ '+r.bath+' · นั่งเล่น '+r.living+' · ครัว '+r.kitchen+' · จอดรถ '+r.park+(r.other?' · '+r.other:''),spec:{'ประหยัด':'economy','มาตรฐาน':'standard','ดี':'premium'}[A.spec]||A.spec});
  if(F==='1.2')Object.assign(o,{deed_no:pl.deed_no,amphoe:pl.amphoe,province12:pl.province,plot:pl.rai,plot_sqw:sqw()||'',types:types(),type:TMAP[types()[0]]||types()[0],land:{'เป็นของตัวเองแล้ว':'own','กำลังจะซื้อ':'buy'}[A.land],land_price:(A.buy||{}).land_price||'',finance:(A.fund||{}).finance||'',budget:(A.fund||{}).budget||''});
  if(F!=='1.1'&&F!=='1.2')Object.assign(o,{area2:z.area||'',floors2:z.fl||'',fw:z.w||'',fl:z.l||'',land_sqw:z.land||'',btype:A.btype,province2:A.prov,who:A.who||'',boq_from:A.from||''});
  google.script.run.withSuccessHandler(res=>{
    if(!res.ok){err.textContent=res.msg;nb.disabled=false;nb.textContent='ส่งข้อมูล';return}
    if(res.web){card.innerHTML='<div class="done"><div class="ok">✓</div><h1>เหลืออีก 1 ขั้น</h1><p class="hint">'+res.msg+'</p><p><a id="goline" href="'+res.line+'" target="_top" style="display:inline-block;background:#06C755;color:#fff;font-weight:600;padding:14px 26px;border-radius:999px;text-decoration:none;font-size:18px">ส่งรหัส '+res.ref+' เข้าไลน์</a></p><p class="hint">ถ้ายังไม่ได้เป็นเพื่อน ไลน์จะให้กดเพิ่มเพื่อนก่อน แล้วกดส่งข้อความที่พิมพ์ไว้ให้</p>'+deskBox(res.line,'รหัสงาน '+res.ref)+'</div>';goLine(res.line)}
    else card.innerHTML='<div class="done"><div class="ok">✓</div><h1>ได้รับข้อมูลแล้ว</h1><p class="hint">'+res.msg+'</p><p class="hint">ปิดหน้านี้แล้วกลับไปที่แชต LINE ได้เลย</p></div>';
    nb.style.visibility='hidden';$('back').style.visibility='hidden';$('stepTxt').textContent='ส่งแล้ว';$('bar').style.width='100%';
  }).withFailureHandler(x=>{err.textContent='ส่งไม่สำเร็จ: '+x.message+' · ลองใหม่อีกครั้ง';nb.disabled=false;nb.textContent='ส่งข้อมูล'}).submitForm(o);
}
const TMAP={'ห้องเช่ารายเดือน':'rental','ร้านค้าชั้นล่าง + ห้องเช่า':'shop_rental','อพาร์ตเมนต์ / คอนโด 4–7 ชั้น':'condo','ตึกแถว':'shophouse','โฮมออฟฟิศ':'home_office','ทาวน์โฮม':'townhome','บ้านเดี่ยว':'house','พูลวิลล่าให้เช่ารายวัน':'pool_villa','โกดัง':'warehouse'};
render();
}
